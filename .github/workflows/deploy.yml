name: De-Light API — Validate & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Validate Code ──────────────────────────────────────────────────────────
  validate:
    name: Validate PHP Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, gd, xml, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Copy .env for validation
        run: |
          cp .env.example .env
          echo "APP_KEY=" >> .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Generate JWT secret
        run: php artisan jwt:secret --force

      - name: Validate routes load correctly
        run: php artisan route:list

      - name: Run migrations on SQLite (quick validate)
        run: |
          touch database/database.sqlite
          php artisan migrate --force --database=sqlite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run seeder
        run: php artisan db:seed --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: ✅ Validation passed
        run: echo "API code is valid — ready to deploy to Render!"
