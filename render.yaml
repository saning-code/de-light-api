# ─────────────────────────────────────────────────────────────────────────────
# De-Light API — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY:
# 1. Go to https://dashboard.render.com/blueprints
# 2. Click "New Blueprint Instance"
# 3. Connect your GitHub repo: saning-code/de-light-api
# 4. Render reads this file and creates everything automatically
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: de-light-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon          # Free tier only supports oregon
    branch: main
    healthCheckPath: /ping
    autoDeploy: true        # Auto-redeploy on every git push

    envVars:
      # ── App ────────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: De-Light
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_URL
        fromService:
          type: web
          name: de-light-api
          property: host

      # ── App Key & JWT (set manually in Render dashboard) ─────────────────────
      - key: APP_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_TTL
        value: "1440"

      # ── Database (auto-wired from the PostgreSQL database below) ──────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: de-light-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: de-light-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: de-light-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: de-light-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: de-light-db
          property: password

      # ── Logging ───────────────────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # ── Session / Cache / Queue (database driver — no Redis needed) ───────
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # ── CORS (Flutter web app URL) ────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://saning-code.github.io

# ── PostgreSQL Database (free tier — 1GB, 90 days then $7/mo) ────────────────
databases:
  - name: de-light-db
    plan: free
    region: oregon
    databaseName: delight
    user: delight
