# ─────────────────────────────────────────────────────────────────────────────
# Render.com deployment config for De-Light API
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: de-light-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # Change to "starter" ($7/mo) for always-on
    region: frankfurt   # Closest to Ghana. Options: oregon, ohio, singapore
    branch: main
    healthCheckPath: /ping
    envVars:
      - key: APP_NAME
        value: De-Light
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true   # Render auto-generates this
      - key: APP_URL
        fromService:
          type: web
          name: de-light-api
          property: host
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: de-light-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: de-light-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: de-light-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: de-light-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: de-light-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 1440
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: de-light-db
    databaseName: delight
    user: delight
    plan: free
